# =============================================================================
# Docker Compose - Staging Environment
# Event Management Portal - Staging deployment configuration
# =============================================================================

version: '3.8'

networks:
  staging-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  staging-mongodb-data:
  staging-redis-data:
  staging-nginx-certs:
  staging-prometheus-data:
  staging-grafana-data:


services:
  # ===========================================================================
  # Database Services
  # ===========================================================================

  mongodb:
    image: mongo:7.0
    container_name: staging-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    ports:
      - "127.0.0.1:27018:27017" # Different port for staging
    volumes:
      - staging-mongodb-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./backups:/backups
    networks:
      - staging-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --logpath
      - /dev/stdout
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  redis:
    image: redis:7.2-alpine
    container_name: staging-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379" # Different port for staging
    volumes:
      - staging-redis-data:/data
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - staging-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # Backend API Service
  # ===========================================================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-production
      args:
        NODE_ENV: staging
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-staging}
    image: ${BACKEND_IMAGE:-eventmgmt-backend:staging}
    container_name: staging-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 3000

      # Database Configuration
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DATABASE}?authSource=admin
      REDIS_URL: redis://redis:6379

      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # API Configuration
      API_VERSION: v1
      CORS_ORIGIN: ${CORS_ORIGIN}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-1000}

      # External Services
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Email Configuration
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}

      # Security
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      SESSION_SECRET: ${SESSION_SECRET}

      # Monitoring
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}

    ports:
      - "127.0.0.1:3001:3000" # Internal port for staging
    volumes:
      - ./logs:/app/logs
      - /tmp:/tmp
    networks:
      - staging-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=backend,environment=staging"

  # ===========================================================================
  # Frontend Application Service
  # ===========================================================================

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-production
      args:
        NODE_ENV: staging
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
        VERSION: ${VERSION:-staging}

        # Build-time variables for Next.js
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
        NEXT_PUBLIC_ENVIRONMENT: staging
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}

    image: ${FRONTEND_IMAGE:-eventmgmt-frontend:staging}
    container_name: staging-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 3001

      # Runtime variables
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # OAuth Configuration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Internal API URL for SSR
      INTERNAL_API_URL: http://backend:3000/api/v1

    ports:
      - "127.0.0.1:3002:3001" # Internal port for staging
    volumes:
      - ./logs:/app/logs
    networks:
      - staging-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/api/health" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=frontend,environment=staging"

  # ===========================================================================
  # Reverse Proxy and Load Balancer
  # ===========================================================================

  nginx:
    image: nginx:1.25-alpine
    container_name: staging-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
      - staging-nginx-certs:/etc/letsencrypt
      - ./logs/nginx:/var/log/nginx
    networks:
      - staging-network
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ===========================================================================
  # SSL Certificate Management
  # ===========================================================================

  certbot:
    image: certbot/certbot:latest
    container_name: staging-certbot
    volumes:
      - staging-nginx-certs:/etc/letsencrypt
      - ./configs/certbot:/etc/certbot:ro
    networks:
      - staging-network
    profiles:
      - ssl
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${STAGING_DOMAIN}

  # ===========================================================================
  # Monitoring Services
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: staging-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://staging.eventmanagement.com/prometheus'
    ports:
      - "127.0.0.1:9091:9090" # Different port for staging
    volumes:
      - ./monitoring/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - staging-prometheus-data:/prometheus
    networks:
      - staging-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  grafana:
    image: grafana/grafana:10.0.0
    container_name: staging-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://staging.eventmanagement.com/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DATABASE_TYPE: sqlite3
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - staging-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - staging-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # Backup Service
  # ===========================================================================

  backup:
    image: alpine:latest
    container_name: staging-backup
    restart: "no"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DATABASE}?authSource=admin
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *} # Daily at 2 AM
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    networks:
      - staging-network
    profiles:
      - backup
    command: sh -c "apk add --no-cache mongodb-tools && crond -f -d 8"

# ===========================================================================
# Network Configuration
# ===========================================================================

# Additional configurations for staging environment
# - Separate network isolation from production
# - Internal service communication
# - External access through nginx proxy
# - SSL termination and certificate management
