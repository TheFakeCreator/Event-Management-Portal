# Grafana Datasource Provisioning
# Automatically configure Prometheus and Loki as data sources

apiVersion: 1

datasources:
  # Prometheus - Metrics data source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      alertmanagerUid: alertmanager
      prometheusType: Prometheus
      prometheusVersion: 2.45.0
      cacheLevel: 'High'
      incrementalQuerying: true
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
    
  # Alertmanager - Alerts data source
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    uid: alertmanager
    editable: true
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
      
  # Loki - Logs data source
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: "trace_id=(\\w+)"
          name: trace_id
          url: '$${__value.raw}'

  # MongoDB - Database monitoring (via Prometheus)
  - name: MongoDB
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      exemplarTraceIdDestinations: []
      httpMethod: POST
    hide: true
    
  # Redis - Cache monitoring (via Prometheus) 
  - name: Redis
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      exemplarTraceIdDestinations: []
      httpMethod: POST
    hide: true