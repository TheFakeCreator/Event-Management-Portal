# =============================================================================
# Prometheus Configuration - Test Environment
# Event Management Portal - Monitoring and metrics collection
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'test'
    project: 'event-management-portal'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files: []

# Scrape configuration
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scrape_interval: 30s

  # Backend API monitoring
  - job_name: 'backend-api'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: backend:3000

  # Frontend application monitoring
  - job_name: 'frontend-app'
    static_configs:
      - targets: ['frontend:3001']
    metrics_path: /api/metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Database monitoring (if metrics exposed)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics
    scrape_interval: 30s

  # Health check monitoring
  - job_name: 'health-checks'
    static_configs:
      - targets: 
          - 'backend:3000'
          - 'frontend:3001'
    metrics_path: /health
    scrape_interval: 10s
    scrape_timeout: 5s
    params:
      format: ['prometheus']

# Storage configuration for test environment
storage:
  tsdb:
    path: /prometheus
    retention.time: 2h
    retention.size: 512MB